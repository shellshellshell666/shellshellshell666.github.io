<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Tech Logistics | Partner Portal</title>
    <style>
        /* アメリカ人好みの清潔感と信頼感のあるデザイン */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #0071dc; /* Walmartブルーで信頼感UP */
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #111;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box; /* ズレ防止 */
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #0071dc;
        }
        .submit-btn {
            width: 100%;
            background-color: #0071dc;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background-color: #0056a4;
        }
        .footer-links {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h1>Create Your Account</h1>
    <p class="subtitle">Join the US leading hardware distribution network.</p>
    
    <form action="#" method="POST" onsubmit="alert('System Processing...'); return false;">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
            <label>Business Email</label>
            <input type="email" placeholder="name@company.com" required>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Min. 8 characters" required>
        </div>

        <button type="submit" class="submit-btn">SIGN UP NOW</button>
    </form>

    <div class="footer-links">
        By signing up, you agree to the Terms of Service.
    </div>
</div>

</body>
</html>
